openapi: 3.1.0
info:
  title: Forgetcase SLA schemas
  version: 0.1.0
paths: {}
components:
  schemas:
    CaseId:
      type: string
      pattern: '^cas_[0-9A-HJKMNP-TV-Z]{26}$'
    ChallengeId:
      type: string
      pattern: '^idc_[0-9A-HJKMNP-TV-Z]{26}$'

    SlaClock:
      type: object
      required: [caseId, receivedAt, clockStartAt, dueAt, paused, extensionApplied]
      properties:
        caseId:
          $ref: '#/components/schemas/CaseId'
        receivedAt:
          type: string
          format: date-time
        clockStartAt:
          type: string
          format: date-time
          description: Day after receipt (calendar-month start).
        dueAt:
          type: string
          format: date-time
        operationalTargetDueAt:
          type: string
          format: date-time
          description: Optional 28-day operational target.
        paused:
          type: boolean
        pausedAt:
          type: string
          format: date-time
        extensionApplied:
          type: boolean
        extensionReason:
          type: string
          enum: [complex, multiple_requests]
        extensionNoticeDueAt:
          type: string
          format: date-time
        additionalMonths:
          type: integer
          maximum: 2

    SlaExtensionRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          enum: [complex, multiple_requests]
        additionalMonths:
          type: integer
          minimum: 1
          maximum: 2
          default: 2
        noticeDraft:
          type: string

    IdentityChallengeStatus:
      type: string
      enum: [pending, satisfied, withdrawn]

    IdentityChallenge:
      type: object
      required: [challengeId, caseId, requestedAt, status]
      properties:
        challengeId:
          $ref: '#/components/schemas/ChallengeId'
        caseId:
          $ref: '#/components/schemas/CaseId'
        requestedAt:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/IdentityChallengeStatus'
        proportionalityNote:
          type: string
        satisfiedAt:
          type: string
          format: date-time

    IdentityChallengeRequest:
      type: object
      required: [proportionalityNote]
      properties:
        proportionalityNote:
          type: string
          minLength: 1

    IdentityChallengeSatisfy:
      type: object
      properties:
        note:
          type: string

    SlaClockResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/SlaClock'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta

    IdentityChallengeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/IdentityChallenge'
        meta:
          $ref: ./common/envelopes.yaml#/components/schemas/ResponseMeta
