apis:
  identity:
    root: src/identity.yaml
  cases:
    root: src/cases.yaml
  assessments:
    root: src/assessments.yaml
  sla:
    root: src/sla.yaml
  fulfilment:
    root: src/fulfilment.yaml
  correspondence:
    root: src/correspondence.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
